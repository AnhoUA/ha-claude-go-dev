name: Claude Code Go Dev
version: "0.1.4"
slug: claude_code_go_dev
description: Claude Code для Home Assistant із Go, git, GitHub CLI та SSH (на базі ha-claude)
url: https://github.com/AnhoUA/ha-claude-go-dev
# Готові образи збирає GitHub Actions (.github/workflows/build.yaml); HA їх лише завантажує
image: ghcr.io/anhoua/{arch}-addon-claude_code_go_dev
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 7681
panel_icon: mdi:language-go
panel_title: Claude Go
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: false
  - type: share
    read_only: false
  - type: media
    read_only: false
# Опції базового доповнення ha-claude: run.sh із базового образу читає їх через bashio,
# тож вони мають бути й тут
options:
  remote_control: true
  session_name: Home Assistant Go
  storage_path: /share/claude
schema:
  remote_control: bool
  session_name: str
  storage_path: match(^/(share|media)/.+)
  anthropic_api_key: password?
  git_user_name: str?
  git_user_email: email?
  github_token: password?
